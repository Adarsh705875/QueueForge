spring.application.name=queueforge

# Local development defaults only. Production overrides these in application-prod.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/queueforge}
spring.datasource.username=${DB_USERNAME:queueforge}
spring.datasource.password=${DB_PASSWORD:queueforge_dev_password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.placeholders.legacyTimeZone=${LEGACY_TIME_ZONE:Asia/Kolkata}
spring.flyway.validate-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:local-dev-redis-password}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

server.port=8080
server.shutdown=graceful
# Keep JVM and database timestamp interpretation consistent.
server.error.include-message=never
server.error.include-stacktrace=never
spring.lifecycle.timeout-per-shutdown-phase=30s

queueforge.security.api-key=${QUEUEFORGE_API_KEY:local-development-only-key-change-before-deployment-123456789}
queueforge.worker.enabled=true
queueforge.worker.concurrency=${WORKER_CONCURRENCY:4}
queueforge.worker.poll-interval-ms=${WORKER_POLL_INTERVAL_MS:500}
queueforge.worker.lease-duration-seconds=${WORKER_LEASE_SECONDS:30}
queueforge.worker.heartbeat-interval-ms=${WORKER_HEARTBEAT_MS:10000}
queueforge.worker.recovery-interval-ms=${WORKER_RECOVERY_MS:5000}
queueforge.idempotency.required=false
queueforge.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
queueforge.rate-limit.refill-per-second=${RATE_LIMIT_REFILL_PER_SECOND:10}

management.server.port=8081
management.server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
management.info.env.enabled=true
info.app.name=QueueForge
info.app.description=Reliable background job processing service
info.app.version=1.0.0

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
logging.level.root=INFO
logging.level.queueforge=INFO
