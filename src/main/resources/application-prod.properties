# Every secret and endpoint must be supplied by the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.placeholders.legacyTimeZone=${LEGACY_TIME_ZONE:Asia/Kolkata}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

queueforge.security.api-key=${QUEUEFORGE_API_KEY}
queueforge.worker.concurrency=${WORKER_CONCURRENCY:8}
queueforge.worker.lease-duration-seconds=${WORKER_LEASE_SECONDS:30}
queueforge.worker.heartbeat-interval-ms=${WORKER_HEARTBEAT_MS:10000}
queueforge.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
queueforge.rate-limit.refill-per-second=${RATE_LIMIT_REFILL_PER_SECOND:10}
management.server.port=${MANAGEMENT_PORT:8081}
server.forward-headers-strategy=framework

queueforge.idempotency.required=true
